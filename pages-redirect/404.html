<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DropKeeper has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://direcat.net/dropkeeper/">
<link rel="canonical" href="https://direcat.net/dropkeeper/">
<script>
  // Keep deep links working: /dropkeeper/foo?x#y -> https://direcat.net/dropkeeper/foo?x#y
  (function () {
    var path = location.pathname.replace(/^\/dropkeeper(?=\/|$)/, "").replace(/^\/+/, "");
    location.replace("https://direcat.net/dropkeeper/" + path + location.search + location.hash);
  })();
</script>
</head>
<body>
<p>DropKeeper has moved to <a href="https://direcat.net/dropkeeper/">direcat.net/dropkeeper</a>.</p>
</body>
</html>
