name: Deploy site

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only master is deployed, even when dispatched manually from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site with cache-busted asset URLs
        run: |
          rm -rf build
          cp -R site build
          v="${GITHUB_SHA::7}"
          # index.html is the only file that references assets (site.css and
          # site.js contain no URLs). Only relative assets/... references are
          # rewritten; absolute URLs (canonical, og:image, ...) stay untouched.
          sed -E -i "s@\b(src|href|poster|srcset)=\"(assets/[^\"?]+)\"@\1=\"\2?v=${v}\"@g" build/index.html
          n=$(grep -c "?v=${v}" build/index.html || true)
          echo "Rewritten references: ${n} lines"
          if [ "${n}" -eq 0 ]; then echo "::error::No asset references were rewritten"; exit 1; fi

      - name: Deploy via rsync over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          # The key is forced to `rrsync -wo -munge <webroot>/dropkeeper` on the
          # server, so the destination is relative to that directory.
          rsync -rltvz --delete --chmod=D755,F644 \
            -e "ssh -i $key -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            build/ "$DEPLOY_TARGET:./"

      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
