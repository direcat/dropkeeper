name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: scripts/install-ci-tools.sh
      - name: Version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          mkdir -p build
          scripts/changelog-section.sh "$VERSION" > build/notes.md
      - name: Offline guard
        run: scripts/offline-guard.sh
      - name: Test
        run: |
          swift test --package-path Packages/DropKeeperCore
          xcodegen generate
          xcodebuild test -project DropKeeper.xcodeproj -scheme DropKeeper -destination 'platform=macOS,arch=arm64' -quiet
      - name: Build
        run: scripts/build-release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Binary offline check
        run: scripts/check-binary.sh build/release/DropKeeper.app
      - name: DMG
        run: scripts/make-dmg.sh "$VERSION"
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: build/notes.md
          files: |
            build/release/DropKeeper-${{ env.VERSION }}.zip
            build/release/DropKeeper-${{ env.VERSION }}.dmg
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          scripts/update-tap.sh "$VERSION" "$(cat "build/release/DropKeeper-${VERSION}.zip.sha256")"
