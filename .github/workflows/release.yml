name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: scripts/install-ci-tools.sh
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: |
          mkdir -p build
          scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > build/notes.md
      - name: Offline guard
        run: scripts/offline-guard.sh
      - name: Test
        run: |
          swift test --package-path Packages/DropKeeperCore
          xcodegen generate
          xcodebuild test -project DropKeeper.xcodeproj -scheme DropKeeper -destination 'platform=macOS,arch=arm64' -quiet
      - name: Build
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"
      - name: Binary offline check
        run: scripts/check-binary.sh build/release/DropKeeper.app
      - name: DMG
        run: scripts/make-dmg.sh "${{ steps.version.outputs.version }}"
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: build/notes.md
          files: |
            build/release/DropKeeper-${{ steps.version.outputs.version }}.zip
            build/release/DropKeeper-${{ steps.version.outputs.version }}.dmg
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: >-
          scripts/update-tap.sh "${{ steps.version.outputs.version }}"
          "$(cat build/release/DropKeeper-${{ steps.version.outputs.version }}.zip.sha256)"
