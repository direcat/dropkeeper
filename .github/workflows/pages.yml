name: Pages

# The site now lives at https://direcat.net/dropkeeper/ (see deploy-site.yml).
# Run this workflow manually once to serve a redirect from the old GitHub Pages URL.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
